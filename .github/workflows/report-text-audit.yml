name: Temporary report text audit

on:
  push:
    branches: ["work/student-management-hardening-2026-10-25"]
    paths:
      - "Student_Management_System [ Final Edited ].docx"
      - ".github/workflows/report-text-audit.yml"

permissions:
  contents: read
  actions: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract report paragraphs without adding a runtime dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET
          import hashlib

          source = Path("Student_Management_System [ Final Edited ].docx")
          namespace = {"w": "http://schemas.openxmlformats.org/wordprocessingml/2006/main"}
          with ZipFile(source) as package:
              xml = package.read("word/document.xml")
          root = ET.fromstring(xml)
          paragraphs = []
          for paragraph in root.findall(".//w:p", namespace):
              value = "".join(node.text or "" for node in paragraph.findall(".//w:t", namespace))
              if value.strip():
                  paragraphs.append(value)
          extracted = "\n".join(paragraphs) + "\n"
          Path("report-text-audit.txt").write_text(extracted, encoding="utf-8")
          print(f"Extracted {len(paragraphs)} non-empty paragraphs; {len(extracted)} characters.")
          print(f"Source document SHA-256: {hashlib.sha256(source.read_bytes()).hexdigest()}")
          PY
      - name: Upload extracted text for repository audit
        uses: actions/upload-artifact@v4
        with:
          name: report-text-audit
          path: report-text-audit.txt
          retention-days: 1
