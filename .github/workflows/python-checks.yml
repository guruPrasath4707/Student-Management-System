name: Python checks

on:
  push:
    branches: [main, "work/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Extract project report text for audit
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET
          import hashlib

          source = Path("Student_Management_System [ Final Edited ].docx")
          namespace = {"w": "http://schemas.openxmlformats.org/wordprocessingml/2006/main"}
          with ZipFile(source) as package:
              xml = package.read("word/document.xml")
          root = ET.fromstring(xml)
          paragraphs = []
          for paragraph in root.findall(".//w:p", namespace):
              value = "".join(node.text or "" for node in paragraph.findall(".//w:t", namespace))
              if value.strip():
                  paragraphs.append(value)
          extracted = "\\n".join(paragraphs) + "\\n"
          Path("report-text-audit.txt").write_text(extracted, encoding="utf-8")
          print(f"Extracted {len(paragraphs)} paragraphs; SHA-256 {hashlib.sha256(source.read_bytes()).hexdigest()}")
          PY
      - name: Upload temporary report text audit artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: report-text-audit
          path: report-text-audit.txt
          retention-days: 1
